<script src="assets/js/app.js"></script>
<script>
PORTFOLIO.ready(function () {
  const D = PORTFOLIO.data;
  const grid = document.getElementById('proj-grid');
  const bar = document.getElementById('filter-bar');

  function getQueryCat() {
    const p = new URLSearchParams(location.search);
    return p.get('category') || 'all';
  }
  let active = getQueryCat();

  function renderBar() {
    const all = D.projects.length;
    let html = '<div class="chip' + (active === 'all' ? ' active' : '') + '" data-cat="all">全部 <b>' + all + '</b></div>';
    D.categories.forEach(function (c) {
      const cnt = D.projects.filter(function (p) { return p.category === c.id; }).length;
      html += '<div class="chip' + (active === c.id ? ' active' : '') + '" data-cat="' + c.id + '">' + c.name + ' <b>' + cnt + '</b></div>';
    });
    bar.innerHTML = html;
    bar.querySelectorAll('.chip').forEach(function (chip) {
      chip.addEventListener('click', function () {
        active = chip.dataset.cat;
        const url = active === 'all' ? 'category.html' : 'category.html?category=' + active;
        history.replaceState(null, '', url);
        renderBar();
        renderGrid();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
  }

  function renderGrid() {
    const list = PORTFOLIO.byCat(active);
    if (!list.length) { grid.innerHTML = '<div class="empty">NO PROJECTS IN THIS CATEGORY</div>'; return; }
    const meta = active === 'all' ? null : PORTFOLIO.catMeta(active);
    grid.innerHTML = list.map(function (p, i) {
      const cat = PORTFOLIO.catMeta(p.category);
      return '<a class="proj-card reveal" href="project.html?id=' + encodeURIComponent(p.id) + '" style="transition-delay:' + (i % 9 * 30) + 'ms">' +
        '<div class="thumb-wrap">' +
          '<img src="' + p.thumb + '" alt="' + PORTFOLIO.esc(p.name) + '" loading="lazy">' +
          '<span class="badge">' + p.id.toUpperCase() + '</span>' +
        '</div>' +
        '<div class="body">' +
          '<div class="cat">' + cat.name + ' · ' + cat.name_en + '</div>' +
          '<h3>' + PORTFOLIO.esc(p.name) + '</h3>' +
          '<div class="meta"><span>' + p.images.length + ' IMAGES</span><span class="view">查看详情 →</span></div>' +
        '</div>' +
      '</a>';
    }).join('');
    PORTFOLIO.initReveal();
  }

  renderBar();
  renderGrid();
  PORTFOLIO.initNav();
});
</script>
</body>
