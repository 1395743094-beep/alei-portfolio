<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目详情 · 啊lei啊lei 2026 作品集</title>
<meta name="description" content="啊lei啊lei 作品项目详情 — 大健康产品视觉设计交付。">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23ffffff'/><text x='50' y='72' font-size='40' font-family='sans-serif' font-weight='800' text-anchor='middle' fill='%23ff2741'>ALL</text></svg>">
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a href="index.html" class="brand"><span class="logo">啊lei啊lei</span><span class="sub">作品集 · 2026</span></a>
    <div class="menu" id="menu">
      <a href="index.html">首页</a>
      <a href="category.html">作品</a>
      <a href="about.html">关于</a>
      <a href="contact.html">联系</a>
      <a href="category.html" class="nav-cta">浏览全部</a>
    </div>
    <div class="burger" id="burger"><span></span><span></span><span></span></div>
  </div>
</nav>

<div class="detail-head">
  <div class="wrap-narrow">
    <a href="javascript:history.back()" class="back">返回列表</a>
    <div id="d-title"><div class="loader"><div class="spin"></div></div></div>
  </div>
</div>

<div class="wrap">
  <div class="detail-grid" id="d-grid"></div>
</div>

<footer>
  <div class="wrap">
    <div class="copy">© 2026 啊lei啊lei · 大健康产品视觉设计</div>
    <div class="flinks">
      <a href="index.html">首页</a>
      <a href="category.html">作品</a>
      <a href="about.html">关于</a>
      <a href="contact.html">联系</a>
    </div>
  </div>
</footer>

<script src="assets/js/app.js"></script>
<script>
PORTFOLIO.ready(function () {
  const D = PORTFOLIO.data;
  const id = new URLSearchParams(location.search).get('id');
  const p = id ? PORTFOLIO.get(id) : null;
  const titleEl = document.getElementById('d-title');
  const grid = document.getElementById('d-grid');

  if (!p) {
    titleEl.innerHTML = '<h1>项目未找到</h1><div class="sub">PROJECT NOT FOUND</div>';
    grid.innerHTML = '<div class="empty">该项目不存在或链接有误。<br><br><a href="category.html" class="btn btn-primary">返回作品列表</a></div>';
    PORTFOLIO.initNav(); return;
  }

  const cat = PORTFOLIO.catMeta(p.category);
  document.title = p.name + ' · 啊lei啊lei 2026 作品集';

  const sibs = D.projects.filter(x => x.category === p.category);
  const idx = sibs.findIndex(x => x.id === p.id);
  const prev = sibs[idx - 1], next = sibs[idx + 1];

  titleEl.innerHTML =
    '<h1>' + PORTFOLIO.esc(p.name) + '</h1>' +
    '<div class="sub">' + cat.name + (p.subcategory_name ? ' <span class="sep">·</span> ' + PORTFOLIO.esc(p.subcategory_name) : '') +
    ' <span class="sep">·</span> ' + p.image_count + ' 张视觉</div>';

  const mainHtml = p.images.map((src, i) =>
    '<figure><img src="' + src + '" alt="' + PORTFOLIO.esc(p.name) + ' · ' + (i + 1) + '" loading="' + (i === 0 ? 'eager' : 'lazy') + '"></figure>'
  ).join('');

  const sideHtml =
    '<aside class="detail-side">' +
      '<div class="info-card">' +
        '<div class="ttl">项目信息</div>' +
        '<div class="ik"><span class="k">分类</span><span class="v">' + cat.name + '</span></div>' +
        (p.subcategory_name ? '<div class="ik"><span class="k">子分类</span><span class="v">' + PORTFOLIO.esc(p.subcategory_name) + '</span></div>' : '') +
        '<div class="ik"><span class="k">视觉数量</span><span class="v">' + p.image_count + ' 张</span></div>' +
        '<div class="ik"><span class="k">设计师</span><span class="v">啊lei啊lei</span></div>' +
        '<div class="ik"><span class="k">交付类型</span><span class="v">包装 / 主图</span></div>' +
      '</div>' +
      '<div class="info-card">' +
        '<div class="ttl">切换项目</div>' +
        (prev ? '<a class="ik" style="display:flex" href="project.html?id=' + encodeURIComponent(prev.id) + '"><span class="k">上一个</span><span class="v" style="color:var(--blue)">' + PORTFOLIO.esc(prev.name) + '</span></a>' : '<div class="ik"><span class="k">上一个</span><span class="v" style="color:var(--ink-muted)">无</span></div>') +
        (next ? '<a class="ik" style="display:flex" href="project.html?id=' + encodeURIComponent(next.id) + '"><span class="k">下一个</span><span class="v" style="color:var(--blue)">' + PORTFOLIO.esc(next.name) + '</span></a>' : '<div class="ik"><span class="k">下一个</span><span class="v" style="color:var(--ink-muted)">无</span></div>') +
        '<a class="ik" style="display:flex" href="category.html?category=' + p.category + '"><span class="k">分类列表</span><span class="v" style="color:var(--blue)">查看全部</span></a>' +
      '</div>' +
    '</aside>';

  grid.innerHTML = '<div class="detail-main">' + mainHtml + '</div>' + sideHtml;
  PORTFOLIO.initNav();
});
</script>
</body>
</html>
